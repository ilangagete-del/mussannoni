[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sars-convert"
version = "1.0.0"
description = "Convert Mwanza SARS result reports from fixed-layout HTML into pure HTML+CSS printed to A4 via WeasyPrint"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "weasyprint>=62",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "black>=24"]

[project.scripts]
sars = "sars.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]
