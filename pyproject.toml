[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sars-convert"
version = "1.0.0"
description = "Convert Mwanza SARS result reports from fixed-layout HTML into pure HTML+CSS printed to A4 via WeasyPrint"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "weasyprint>=62",
    "pillow>=10",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "black>=24",
    # Dev-only: tools/templating_bakeoff.py measures a Jinja2 port of the row
    # loop against the built-in mechanism. It is deliberately NOT a runtime
    # dependency - see docs/DECISIONS.md for the measured reason.
    "jinja2>=3.1",
]

[project.scripts]
sars = "sars.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Everything the renderer needs at runtime must ship in the wheel. There is no
# fallback font and no way to re-derive a layout without the source PDFs, so both
# are package data rather than build output. See docs/PACKAGING.md.
"sars.assets" = ["fonts/*.ttf", "fonts/*.otf", "fonts/manifest.json", "fonts/upstream/*"]
"sars.secondary.templates" = ["layouts/*.json.gz", "layouts/*.json"]

[tool.pytest.ini_options]
markers = [
    "slow: rasterises every page of every report through the fidelity gate",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]
